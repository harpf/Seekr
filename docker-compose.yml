services:
  document-search:
    build: .
    container_name: document-search
    # Run as the unprivileged seekr uid:gid baked into the image (see Dockerfile).
    # NOTE: the host ./data directory must be writable by uid 10001
    # (e.g. `sudo chown -R 10001:10001 ./data`).
    user: "10001:10001"
    # ── Optional elevated capability for in-app SMB/NFS mounting ────────
    # Only needed if you use the in-app SMB/NFS mount feature (the app issues
    # mount(8) syscalls). Uncomment to opt in; leave disabled otherwise.
    # cap_add:
    #   - SYS_ADMIN
    environment:
      DOCUMENT_SEARCH_DB: /data/document_index.db
      DOCUMENT_SEARCH_CONFIG_PATH: /data/config.json
      DOCUMENT_SEARCH_UI_UPDATE_ENABLED: "true"
      # Ollama integration — points to the ollama service on the internal network
      DOCUMENT_SEARCH_OLLAMA_URL: "http://ollama:11434"
      DOCUMENT_SEARCH_OLLAMA_MODEL: "llama3.2"
      # Override upload root so uploads land in the writable /data volume:
      DOCUMENT_SEARCH_UPLOAD_ROOT: "/data/uploads"
      # Home Assistant integration — set a strong random value to enable /api/ha/* endpoints
      # Generate one with: python3 -c "import secrets; print(secrets.token_hex(32))"
      DOCUMENT_SEARCH_API_KEY: ""
      # ── OCR (for scanned / image-based PDFs and embedded logos) ─────────
      # Tesseract + poppler are already in the image. OCR is OFF by default
      # because it is CPU-intensive. Enable via these env vars (they override
      # the config.json "ocr" block). FORCE_OCR rasterises EVERY page (slowest,
      # max recall); leave it off to OCR only text-less pages + embedded images.
      # DOCUMENT_SEARCH_OCR_ENABLED: "true"
      # DOCUMENT_SEARCH_OCR_LANG: "deu+eng"
      # DOCUMENT_SEARCH_FORCE_OCR: "false"
    expose:
      - "8080"
    healthcheck:
      # Liveness probe — the app's /health never touches the DB, so a slow or
      # locked database won't flap the container. Python is already in the image
      # (no curl dependency required). Use /ready for an external readiness gate.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ./data:/data
      - ./documents:/documents:ro
      # ── Docker socket for in-app update (optional) ──────────────────
      # Mount the host Docker socket to allow the update button to rebuild containers.
      # WARNING: This grants the container root-equivalent access to the host Docker daemon.
      # Only enable on trusted, private deployments.
      # - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: seekr-ollama
    environment:
      # Keep the loaded model in VRAM / RAM between requests
      OLLAMA_KEEP_ALIVE: "24h"
    volumes:
      - ollama_data:/root/.ollama
    # Expose Ollama on the host if you want direct curl/API access:
    # ports:
    #   - "11434:11434"
    restart: unless-stopped
    # ── NVIDIA GPU acceleration (uncomment to enable) ──────────────────
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  tls-proxy:
    image: nginx:1.27-alpine
    container_name: document-search-tls
    depends_on:
      - document-search
    ports:
      - "443:443"
    environment:
      TLS_DOMAIN: Seekr.domain.tld
      TLS_IP: 127.0.0.1
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/entrypoint.sh:/entrypoint.sh:ro
      - ./certs:/certs
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    restart: unless-stopped

volumes:
  # Persists Ollama model weights across container restarts
  ollama_data:
